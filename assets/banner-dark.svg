<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Bin Liu — generative models, agent systems, shipped products">
  <defs>
    <pattern id="lattice" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" rx="2.5" fill="#E4002B"/>
    </pattern>
    <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <mask id="rampMask">
      <rect x="660" y="60" width="270" height="180" fill="url(#ramp)"/>
    </mask>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E4002B" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#E4002B" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E4002B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="280" fill="#0B0B0C"/>
  <rect x="0" y="0" width="1000" height="3" fill="url(#hair)"/>

  <!-- noise resolving into signal -->
  <rect x="660" y="60" width="270" height="180" fill="url(#lattice)" mask="url(#rampMask)"/>
  <rect x="660" y="120" width="18" height="18" rx="2.5" fill="#2B3A55" opacity="0.55"/>
  <rect x="720" y="180" width="18" height="18" rx="2.5" fill="#2B3A55" opacity="0.40"/>
  <rect x="690" y="210" width="18" height="18" rx="2.5" fill="#2B3A55" opacity="0.60"/>
  <rect x="750" y="60" width="18" height="18" rx="2.5" fill="#2B3A55" opacity="0.32"/>
  <rect x="780" y="150" width="18" height="18" rx="2.5" fill="#E8E0D0" opacity="0.16"/>
  <text x="660" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="3" fill="#E8E0D0" opacity="0.30">NOISE</text>
  <text x="918" y="252" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="3" fill="#E4002B" opacity="0.95">SIGNAL</text>

  <!-- identity block -->
  <text x="64" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="4" fill="#E8E0D0" opacity="0.42">HOUSTON, TX &#183; PhD PHYSICS</text>
  <text x="62" y="152" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1" fill="#E8E0D0">BIN LIU</text>
  <rect x="64" y="176" width="78" height="3" fill="#E4002B"/>
  <text x="64" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="2.4" fill="#E8E0D0" opacity="0.66">GENERATIVE AI &#183; AGENT SYSTEMS &#183; AI FOR SCIENCE</text>

  <!-- colorway -->
  <circle cx="71" cy="243" r="7" fill="#E4002B"/>
  <circle cx="91" cy="243" r="7" fill="#E8E0D0"/>
  <circle cx="111" cy="243" r="7" fill="#2B3A55"/>
  <text x="130" y="247" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2.5" fill="#E8E0D0" opacity="0.32">INFRARED / BONE / SLATE</text>
</svg>
